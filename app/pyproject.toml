[project]
name = "easyspotdl"
# Must equal the VERSION file at the repo root (enforced by tests/test_config.py).
version = "0.1.0"
description = "Portable desktop app that turns a Spotify Public Playlist into MP3 files using spotDL."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: runs the real launcher and installs the Engine (needs internet, takes minutes)",
]
